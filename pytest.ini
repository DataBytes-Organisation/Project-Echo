[pytest]
# Excludes src/tests/unit/backend and src/tests/integration/backend on purpose:
# Backend needs its own virtual environment (see docs/team-guides/TDD_Guide.md -
# its requirements.txt pins pydantic<2.0, incompatible with what this default
# environment has). Run those two explicitly via
# src/production/backend/.venv/Scripts/python.exe -m pytest <path>.
testpaths =
    src/tests/unit/engine
    src/tests/integration/engine_backend
    src/tests/pipeline
    src/production/engine
python_files = test_*.py
python_classes = Test*
python_functions = test_*
