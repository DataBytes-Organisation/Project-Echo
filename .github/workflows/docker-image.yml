name: Docker Image CI

on:
  push:
    branches: [ "main", "fix/reduce_docker_size" ]
    paths:
      - 'src/**/*'
      - '.github/workflows/**/*'
      - '.github/ci/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**/*'
      - '.github/workflows/docker-image.yml'
      - '.github/ci/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3  # Use @main for latest, @v3 for stable
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"  # Use 'rmz' for faster deletion (default: 'rm')
        rmz_version: "3.1.1"  # Required when rm_cmd is 'rmz'
        testing: false

    - name: Delete huge unnecessary tools folder
      run: rm -rf /opt/hostedtoolcache

    - uses: actions/checkout@v3
    
    # Install Docker Compose
    - name: Install Docker Compose
      run: |
        sudo apt-get update
        sudo apt-get install -y docker-compose
    
    - name: Build containers
      run: |
        cd src/deployment/docker
        for i in 1 2 3; do
          docker compose -f docker-compose.test.yml -f docker-compose.ci.yml build --no-cache --force-rm && break
          echo "Build attempt $i failed -- retrying in 20s..."
          sleep 20
          if [ "$i" -eq 3 ]; then
            echo "All build attempts failed."
            exit 1
          fi
        done
    - name: Verify isolated R2 CI fixture
      working-directory: src/deployment/docker
      run: |
        docker compose -f docker-compose.test.yml -f docker-compose.ci.yml run --rm --no-deps --entrypoint python echo_engine -B -m unittest discover -s /opt/echo-ci -p 'test_r2_fixture.py' -v

    - name: Start containers
      run: |
        cd src/deployment/docker
        docker compose -f docker-compose.test.yml -f docker-compose.ci.yml up -d
    
    - name: Wait for containers to be ready
      run: sleep 180
      
    - name: Check running containers
      run: |
        cd src/deployment/docker
        RUNNING_CONTAINERS=$(docker compose -f docker-compose.test.yml -f docker-compose.ci.yml ps | grep -c 'Up')
        if [ "$RUNNING_CONTAINERS" -eq 9 ]; then
          echo "All containers are up and running."
        else
          echo "Expected 9 running containers, but found $RUNNING_CONTAINERS. Failing."
          echo "===================== DIAGNOSTICS ====================="
          echo "----- docker compose ps -a (all container states) -----"
          docker compose -f docker-compose.test.yml -f docker-compose.ci.yml ps -a
          echo "----- disk usage (df -h) -----"
          df -h
          echo "----- per-container logs (tail 60) -----"
          docker compose -f docker-compose.test.yml -f docker-compose.ci.yml logs --tail 60
          echo "======================================================="
          exit 1
        fi
  
    - name: Stop and remove containers
      if: always()
      run: |
        cd src/deployment/docker
        docker compose -f docker-compose.test.yml -f docker-compose.ci.yml down --remove-orphans
