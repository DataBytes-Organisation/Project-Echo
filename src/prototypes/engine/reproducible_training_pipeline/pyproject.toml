[project]
name = "echo-augmentation-training"
version = "0.1.0"
description = "Reproducible PyTorch/Hydra training pipeline for Project Echo species classification (Sprint 1 baseline)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0.1,<2.9",
    "torchaudio>=2.0.0,<2.9",
    "torchvision>=0.15.2",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "lmdb>=1.7.5",
    "audiomentations>=0.42.0",
    "torch-audiomentations>=0.12.0",
    "tqdm>=4.67.1",
    "numpy>=2.2",
    "matplotlib>=3.10.5",
    "umap-learn>=0.5.9.post2",
    "scikit-learn>=1.3",
    "tensorboard>=2.16",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
indent-style = "tab"
