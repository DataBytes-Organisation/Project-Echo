# Source: this config/ folder (config.yaml, config/augmentation/, config/local/,
# config/model/, config/teacher_model/) was provided by Kiernan Nguyen for the
# SpecAugment validation experiment work. Adopted as-is per team agreement to
# build on top of it rather than start a separate config setup.
#
# Note: the "permanent home" mentioned two paragraphs down
# (src/prototypes/engine/augmentation/) was accurate when that sentence was
# written, but this folder was subsequently moved to
# src/prototypes/engine/reproducible_training_pipeline/ to free up the
# `augmentation/` path for Kiernan's own separate work, per team agreement.
# Content unchanged, only the containing folder's name/location moved.

# The project's Hydra settings file. 2 things were changed from the original version
# to move augmentation parameters into configuration rather than hardcoded values:
#   1. The `defaults` list was added a new `augmentation` config group entry.
#   2. `augmentations.image` is replaced with a reference to whichever
#      augmentation preset was selected, instead of a fixed hardcoded block.
# Everything else is unchanged from the original.

# This file (and the rest of this folder) started as a standalone testing
# copy under a local torch_impl/ folder, then moved into its permanent home
# here at src/prototypes/engine/augmentation/ once the changes were verified

defaults:
  - model: efficientnet_v2
  - teacher_model: efficientnet_v2
  # --- Modification 1-------
  # New entry: pulls in one of the preset files from config/augmentation/
  # (none.yaml / light.yaml / default.yaml / heavy.yaml). "default" is used
  # unless overridden - e.g. `python main.py augmentation=light` on the CLI
  - augmentation: default
  - _self_

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}

system:
  audio_data_directory: b3
  background_noise_dir: "background_noise"
  cache_directory: .cache
  use_disk_cache: True

data:
  audio_clip_duration: 2 # seconds
  sample_rate: 48000
  n_fft: 4096
  hop_length: 480 # 10ms hop @ 48kHz sample rate
  n_mels: 384
  fmin: 50
  fmax: 14000
  top_db: 80

  train_split: 0.8
  val_split: 0.2
  num_classes: -1 # Should be inferred from data directory at runtime

run:
  pretrain: true
  train: true
  test: false
  quantise: true
  checkpoint_path: ./outputs/2025-08-23/18-50-17/best_efficientnet_v2_qat.pth

training:
  batch_size: 64
  grad_accum_steps: 2
  epochs: 500
  learning_rate: 1e-3
  num_workers: 12
  device: "cuda" # "cuda" or "cpu"
  # device: "cpu"
  seed: 0
  metric_mode: "min"
  # use_arcface: null
  use_arcface: "circle"
  arcface:
    s: 30
    m: 0.5
  circle:
    s: 80
    m: 0.4

  early_stopping_patience: 15

  distillation:
    enabled: false
    teacher_model_path: best_EFF2_QAT_Circle.pth
    criterion:
      _target_: torch.nn.KLDivLoss
      log_target: true
      reduction: 'batchmean'
    alpha: 0.5
    temperature: 3.0

  criterion:
    _target_: torch.nn.CrossEntropyLoss

  optimizer:
    _target_: torch.optim.AdamW
    lr: ${training.learning_rate}
    weight_decay: 0.01

  scheduler:
    _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
    mode: 'min'
    factor: 0.1
    patience: 10

  # scheduler:
  #   _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  #   T_max: ${training.epochs}
  #   eta_min: 1e-6

# Augmentation settings
augmentations:
  audio:
    _target_: torch_audiomentations.Compose
    transforms:
      # Replaces AddGaussianNoise.
      # f_decay=0.0 ensures White Noise (equivalent to Gaussian).
      # - _target_: torch_audiomentations.AddColoredNoise
      #   output_type: "tensor"
      #   mode: "per_example"
      #   min_snr_in_db: 15.0
      #   max_snr_in_db: 30.0
      #   min_f_decay: 0.0
      #   max_f_decay: 0.0
      #   p: 0.2
      #   sample_rate: ${data.sample_rate}
      - _target_: torch_audiomentations.AddBackgroundNoise
        background_paths: ${system.background_noise_dir}
        min_snr_in_db: 10.0
        max_snr_in_db: 30.0
        p: 0.5
        sample_rate: ${data.sample_rate}

      - _target_: torch_audiomentations.Shift
        output_type: "tensor"
        mode: "per_example"
        min_shift: -0.5
        max_shift: 0.5
        shift_unit: "fraction"
        rollover: false
        p: 0.2
        sample_rate: ${data.sample_rate}

      # Added to replace Pitch/Time variance (not supported in torch-audiomentations)
      - _target_: torch_audiomentations.Gain
        output_type: "tensor"
        mode: "per_example"
        min_gain_in_db: -6.0
        max_gain_in_db: 6.0
        p: 0.2
        sample_rate: ${data.sample_rate}

  # --- Modification 2-----
  # Original: a fixed block hardcoding SpecAugment's 5 parameters directly
  # here (p: 0.5, freq_mask_param: 30, time_mask_param: 80, n_freq_mask: 2,
  # n_time_mask: 2). Replaced with whatever the selected
  # `${augmentation}` preset was (see the `defaults` list above and the
  # config/augmentation/*.yaml preset files).
  image: ${augmentation} # Spectrogram augmentations - selected via `augmentation=<preset>`