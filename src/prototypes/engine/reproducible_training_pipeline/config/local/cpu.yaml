# @package _global_
#
# config/local/cpu.yaml
#
# Bundles the environment-specific parameters needed to run main.py in
# this local setup, so they don't need to be typed out on every command.
# Opt-in only - select with `+local=cpu`. Does NOT change config.yaml's own
# defaults, so it has zero effect on anyone not explicitly selecting it.
#
# The `# @package _global_` line above MUST be the very first line of this
# file - it tells Hydra to merge the keys below into the ROOT of the
# config, exactly as if they'd been typed as normal overrides, instead of
# nested under a `local:` key the way a regular config group would default
# to. (A first attempt at this file put explanatory comments before that
# directive, which silently broke the merge - Hydra only recognises it as
# the very first line.)
#
# Note: comments below referencing "src/prototypes/engine/augmentation/"
# describe this folder's location when they were written. It was
# subsequently moved to src/prototypes/engine/reproducible_training_pipeline/
# (same directory depth, so the relative-path math below is unaffected) -
# see the containing README for why.

hydra:
  run:
    # Keeps Hydra from switching into a new outputs/<date>/<time>/ working
    # directory. Without this, any relative path passed on the command line
    # (e.g. a dataset location) resolves against that shifting folder
    # instead of this folder (src/prototypes/engine/augmentation/), and
    # won't be found.
    dir: .

model:
  params:
    # Skips downloading pretrained ImageNet weights, which hits a Windows
    # SSL certificate-store bug in this setup. Not needed anyway for local
    # runs that only need to confirm the pipeline works, not reach high accuracy
    pretrained: false

system:
  # Points at the real dataset instead of the checked-in `b3` default,
  # which was never part of this repo. `../../../../models-and-data/data_files`
  # is relative to this file's folder, src/prototypes/engine/augmentation/
  # (see the hydra.run.dir fix above, which keeps that relative path
  # resolving correctly) - four levels up reaches the repo root
  # (Project-Echo/), then down into models-and-data/data_files.
  audio_data_directory: ../../../../models-and-data/data_files

# NOT included here:
# - `~augmentations.audio` - a deletion override can only be expressed on
#     the command line (Hydra's `~key` syntax), not stored inside a config
#   file's content, so it always has to be typed explicitly.