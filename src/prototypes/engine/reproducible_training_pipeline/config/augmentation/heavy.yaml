# Augmentation preset: HEAVY (aggressive masking, for experimentation).
# Selected via: python main.py augmentation=heavy
# Not recommended as a starting point - intended for Sprint 2 comparison
# experiments once the "default" preset baseline has been established.

_target_: torchvision.transforms.Compose
transforms:
  - _target_: augment.SpecAugment
    p: 0.7
    n_freq_mask: 3
    n_time_mask: 3
    freq_mask_ratio: 0.20
    time_mask_ratio: 0.15
    max_total_time_ratio: 0.5 # still capped - even heavy mode can never exceed 50% total
    mask_value: "zero"