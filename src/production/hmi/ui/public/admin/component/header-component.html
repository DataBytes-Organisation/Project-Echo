<!--  Header Start -->
<header class="app-header">
  <style>
    :root { --echo-green: #2F6E4F; --echo-green-dark: #26583f; }

    /* Override Bootstrap primary/success to match style guide */
    .btn-primary, .btn-success {
      background-color: var(--echo-green) !important;
      border-color: var(--echo-green) !important;
      color: #ffffff !important;
    }

    .btn-primary:hover, .btn-success:hover,
    .btn-primary:focus, .btn-success:focus {
      background-color: var(--echo-green-dark) !important;
      border-color: var(--echo-green-dark) !important;
      color: #ffffff !important;
    }

    .btn-outline-primary, .btn-outline-success {
      color: var(--echo-green) !important;
      border-color: var(--echo-green) !important;
      background-color: transparent !important;
    }

    .btn-outline-primary:hover, .btn-outline-success:hover {
      background-color: var(--echo-green) !important;
      color: #ffffff !important;
    }

    /* Unread count that sits on the bell. Lives with the header so it styles
       the same on every admin page the component is dropped into. */
    .nav-icon-hover { position: relative; }

    .notification-badge {
      position: absolute;
      top: 2px;
      right: 2px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 9px;
      background-color: #C8473C;
      color: #ffffff;
      font-size: 11px;
      line-height: 18px;
      font-weight: 600;
      text-align: center;
    }

    .notification-badge[hidden] { display: none; }
  </style>
    <nav class="navbar navbar-expand-lg navbar-light">
      <ul class="navbar-nav">
        <li class="nav-item d-block d-xl-none">
          <a class="nav-link sidebartoggler nav-icon-hover" id="headerCollapse" href="javascript:void(0)">
            <i class="ti ti-menu-2" style="color: #2F6E4F;"></i>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link nav-icon-hover" href="/notifications">
            <i class="ti ti-bell-ringing" style="color: #2F6E4F;"></i>
            <!-- was a <class> tag, which is not an element at all, so the unread
                 count had nothing to render into. Hidden until there is a count
                 to show. -->
            <span id="notification-badge" class="notification-badge" hidden></span>
          </a>
        </li>
      </ul>
      <div class="navbar-collapse justify-content-end px-0" id="navbarNav">
        <ul class="navbar-nav flex-row ms-auto align-items-center justify-content-end">
          <a href="/map" target="_blank" class="btn btn-primary">Go to Echo</a>
          <li class="nav-item dropdown">
              <a class="nav-link nav-icon-hover" href="javascript:void(0)" id="drop2" data-bs-toggle="dropdown"
              aria-expanded="false">
              <img src="/admin/images/profile/user-1.jpg" alt="" width="35" height="35" class="rounded-circle">
            </a>
            <div class="dropdown-menu dropdown-menu-end dropdown-menu-animate-up" aria-labelledby="drop2">
              <div class="message-body">
                <a href="/admin/template.html" class="btn btn-outline-primary mx-3 mt-2 d-block">Logout</a>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </nav>
  </header>
  <!--  Header End -->
